<!doctype html>
<html lang="zh-CN" data-variant="A">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f0ec" />
    <meta name="description" content="声景实时半透明膜片光场原型" />
    <title>声景 · 光学膜片场</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="surface" id="surface">
      <canvas id="membrane-field" aria-hidden="true"></canvas>

      <div class="fallback" id="fallback" hidden>
        <div class="fallback-art" aria-hidden="true"></div>
        <p>当前设备无法开启实时光场</p>
      </div>

      <header class="topbar">
        <a class="brand" href="../../../" aria-label="声景首页">
          <span class="brand-mark" aria-hidden="true">声</span>
          <span class="brand-name">声景</span>
          <span class="brand-latin">Soundscape</span>
        </a>

        <div class="variant-switch" role="tablist" aria-label="视觉场域">
          <button type="button" role="tab" data-variant="A" aria-selected="true" title="浮光场域">
            浮光
          </button>
          <button type="button" role="tab" data-variant="B" aria-selected="false" title="夜层场域">
            夜层
          </button>
          <button type="button" role="tab" data-variant="C" aria-selected="false" title="近物场域">
            近物
          </button>
        </div>
      </header>

      <main class="scene-copy" aria-labelledby="scene-title">
        <p class="scene-state">
          <span class="state-pulse" aria-hidden="true"></span>正在聆听 · 07:42
        </p>
        <h1 id="scene-title"><span>雷雨夜里，</span><span>点燃篝火的木屋</span></h1>
        <p class="scene-elements">雨檐 · 远雷 · 松木火 · 夜风</p>
      </main>

      <section class="control-strip" aria-label="声景控制">
        <button
          class="icon-button play-button"
          id="play-button"
          type="button"
          aria-label="暂停"
          title="暂停"
        >
          <i data-lucide="pause" aria-hidden="true"></i>
        </button>

        <div class="control-range volume-control">
          <i data-lucide="volume-2" aria-hidden="true"></i>
          <input id="volume" type="range" min="0" max="100" value="68" aria-label="总音量" />
          <output for="volume" id="volume-output">68</output>
        </div>

        <div class="control-range">
          <span class="range-label">轻</span>
          <input id="intensity" type="range" min="0" max="100" value="54" aria-label="轻重" />
          <span class="range-label">重</span>
        </div>

        <div class="control-range">
          <span class="range-label">简</span>
          <input id="richness" type="range" min="0" max="100" value="72" aria-label="简繁" />
          <span class="range-label">繁</span>
        </div>
      </section>

      <p class="render-status" id="render-status" aria-live="polite">准备光场</p>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
