name: soundscape_client
description: "声景本地优先的持续自然声客户端 MVP。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  audio_service: 0.18.19
  audio_session: 0.2.4
  crypto: 3.0.7
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_soloud: 4.1.7
  path_provider: 2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/generated/catalog/sound-library.v1.json
    - assets/generated/audio/ambie-beach.wav
    - assets/generated/audio/ambie-birds.wav
    - assets/generated/audio/ambie-city-street.wav
    - assets/generated/audio/ambie-coffee-shop.mp3
    - assets/generated/audio/ambie-creek.wav
    - assets/generated/audio/ambie-fireplace.wav
    - assets/generated/audio/ambie-rain.wav
    - assets/generated/audio/ambie-rainforest.mp3
    - assets/generated/audio/ambie-thunder.mp3
    - assets/generated/audio/ambie-underwater.wav
    - assets/generated/audio/ambie-waterfall.wav
    - assets/generated/audio/ambie-white-noise.wav
    - assets/generated/audio/ambie-wind.wav
    - assets/generated/audio/freesound-cafe.mp3
    - assets/generated/audio/freesound-campfire.mp3
    - assets/generated/audio/freesound-city-rain.mp3
    - assets/generated/audio/freesound-clock-ticking.mp3
    - assets/generated/audio/freesound-forest-birds.mp3
    - assets/generated/audio/freesound-rain-window.mp3
    - assets/generated/audio/freesound-river.mp3
    - assets/generated/audio/freesound-singing-bowl.mp3
    - assets/generated/audio/freesound-typewriter.mp3
    - assets/generated/audio/freesound-wind-chimes.mp3
    - assets/generated/images/coastal-night-cover.jpg
    - assets/generated/images/coastal-night-hero.jpg
